    status: na
  AR-NAV-003:
    expect_min_hubs: 1
  AR-TAX-003:
    expect_min_pressgrid_sections: 3
  AR-TAX-006:
    expect_min_matrix_nodes: 5
  AR-RSS-004:
    expect_min_menu_items: 3

hubs_expected:
  - futebol
  - olimpiadas
  - mais
