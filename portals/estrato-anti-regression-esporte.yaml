# Anti-regressão — Estrato Esporte
portal: estrato-esporte
domain: esporte.estrato.cc
web_root: /var/www/esporte.estrato.cc
rss_preset: brasil-esporte
extends: estrato-anti-regression.yaml
satellite: true

required_categories:
  - futebol
  - olimpiadas
  - mais-esportes

