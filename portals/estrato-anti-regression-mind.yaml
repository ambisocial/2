# Estrato Mente — Anti-regressão (satélite)
# Validação: ESTRATO_PORTAL=estrato-mind bash scripts/victor/check-portal-regression.sh --strict

portal: estrato-mind
domain: mente.estrato.cc
web_root: /var/www/mente.estrato.cc
rss_preset: brasil-mind
extends: estrato-anti-regression.yaml
satellite: true

required_categories:
  - aprendizado-cognicao
  - filosofia-autoconhecimento
  - financas-comportamentais

forbidden_menu_categories:
  - economia
  - mercados
  - negocios
  - politica
  - tecnologia
  - brasil
  - sem-categoria

rule_overrides:
  AR-VISUAL-004:
    status: na
    reason: Forex/ticker N/A satélite
  AR-NAV-003:
    expect_min_hubs: 1
  AR-TAX-003:
    expect_min_pressgrid_sections: 3
  AR-TAX-006:
    expect_min_matrix_nodes: 7
  AR-RSS-004:
    expect_min_menu_items: 3

hubs_expected:
  - aprendizado
  - filosofia
  - financas
