# Anti-regressão — Estrato Viagem
portal: estrato-viagem
domain: viagem.estrato.cc
web_root: /var/www/viagem.estrato.cc
rss_preset: brasil-viagem
extends: estrato-anti-regression.yaml
satellite: true

required_categories:
  - destinos
  - rotas-dicas
  - nomadismo

forbidden_menu_categories:
  - economia
  - mercados
  - negocios
  - politica
  - tecnologia
  - brasil
  - sem-categoria

rule_overrides:
  AR-VISUAL-004:
    status: na
  AR-NAV-003:
    expect_min_hubs: 1
  AR-TAX-003:
    expect_min_pressgrid_sections: 3
  AR-TAX-006:
    expect_min_matrix_nodes: 6
  AR-RSS-004:
    expect_min_menu_items: 3

hubs_expected:
  - destinos
  - rotas
  - nomadismo
