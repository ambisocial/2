# Portal Estrato Carros — P1
id: estrato-carros
domain: carros.estrato.cc
title: Estrato Carros
tagline: Automóveis, elétricos e mobilidade
language: pt_BR
timezone: America/Sao_Paulo

theme:
  family: pressgrid
  slug: pressgrid
  source: https://github.com/stantchev/PressGrid-WordPress-Theme/releases/download/v2.5.0/pressgrid-v2.5.0.zip

plugins:
  required:
    - wordpress-seo
    - contact-form-7
  bundled:
    - estrato-portal-bootstrap
    - estrato-rss-bootstrap
    - estrato-publisher-bridge

content:
  mode: pipeline_primary
  rss_preset: brasil-carros
  pipeline_enabled: true
  taxonomy_file: portals/estrato-carros-taxonomy.php

taxonomy:
  schema_version: 2
  file: portals/estrato-carros-taxonomy.php
  layers:
    - categories
    - subcategories

categories:
  - automoveis
  - eletricos
  - mobilidade

branding:
  primary_color: "#7C2D12"
  accent_color: "#FB923C"
  secondary_color: "#9A3412"
  logo_file: estrato-logo.png
  breaking_category: automoveis
  breaking_label: "Carros"

admin:
  email: tpb@tbj.com.br

hosting:
  target: victor
  vps_ip: 187.127.12.186
  web_root: /var/www/carros.estrato.cc
