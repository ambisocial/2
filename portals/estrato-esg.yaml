# Portal ESG — frente ex-Sustain
id: estrato-esg
domain: esg.estrato.cc
title: Estrato ESG
tagline: Clima, transição energética e impacto
language: pt_BR
timezone: America/Sao_Paulo

theme:
  family: pressgrid
  slug: pressgrid
  source: https://github.com/stantchev/PressGrid-WordPress-Theme/releases/download/v2.5.0/pressgrid-v2.5.0.zip

plugins:
  required:
    - wordpress-seo
    - contact-form-7
  bundled:
    - estrato-portal-bootstrap
    - estrato-rss-bootstrap
    - estrato-publisher-bridge

content:
  mode: pipeline_primary
  rss_preset: brasil-esg
  pipeline_enabled: true
  taxonomy_file: portals/estrato-esg-taxonomy.php

taxonomy:
  schema_version: 2
  file: portals/estrato-esg-taxonomy.php
  layers:
    - categories
    - subcategories

categories:
  - clima-ambiente
  - transicao-energia
  - impacto-negocios

branding:
  primary_color: "#0B3D2E"
  accent_color: "#2EC4B6"
  secondary_color: "#145A46"
  logo_file: estrato-logo.png
  breaking_category: clima-ambiente
  breaking_label: "Clima"

admin:
  email: tpb@tbj.com.br

hosting:
  target: victor
  vps_ip: 187.127.12.186
  web_root: /var/www/esg.estrato.cc

legacy:
  replaces: estrato-sustain
