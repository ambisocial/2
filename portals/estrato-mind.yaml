# Portal Conhecimento, Mente e Desenvolvimento Pessoal
id: estrato-mind
domain: mente.estrato.cc
title: Estrato Mente
tagline: Conhecimento, mente e desenvolvimento pessoal
language: pt_BR
timezone: America/Sao_Paulo

theme:
  family: pressgrid
  slug: pressgrid
  source: https://github.com/stantchev/PressGrid-WordPress-Theme/releases/download/v2.5.0/pressgrid-v2.5.0.zip

plugins:
  required:
    - wordpress-seo
    - contact-form-7
  bundled:
    - estrato-portal-bootstrap
    - estrato-rss-bootstrap
    - estrato-publisher-bridge

content:
  mode: pipeline_primary
  rss_preset: brasil-mind
  pipeline_enabled: true
  taxonomy_file: portals/estrato-mind-taxonomy.php

# 3 editorias × 10 nichos (fonte canônica: estrato-mind-taxonomy.php, schema v2)
taxonomy:
  schema_version: 2
  file: portals/estrato-mind-taxonomy.php
  layers:
    - categories
    - subcategories

categories:
  - aprendizado-cognicao
  - filosofia-autoconhecimento
  - financas-comportamentais

branding:
  primary_color: "#1B1B2F"
  accent_color: "#7B68EE"
  secondary_color: "#2D2D44"
  logo_file: estrato-logo.png
  breaking_category: aprendizado-cognicao
  breaking_label: "Aprendizado"

admin:
  email: tpb@tbj.com.br

hosting:
  target: victor
  vps_ip: 187.127.12.186
  web_root: /var/www/mente.estrato.cc
