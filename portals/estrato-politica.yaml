# Portal Estrato Política — P1
id: estrato-politica
domain: politica.estrato.cc
title: Estrato Política
tagline: Brasília, Congressos e poder
language: pt_BR
timezone: America/Sao_Paulo

theme:
  family: pressgrid
  slug: pressgrid
  source: https://github.com/stantchev/PressGrid-WordPress-Theme/releases/download/v2.5.0/pressgrid-v2.5.0.zip

plugins:
  required:
    - wordpress-seo
    - contact-form-7
  bundled:
    - estrato-portal-bootstrap
    - estrato-rss-bootstrap
    - estrato-publisher-bridge

content:
  mode: pipeline_primary
  rss_preset: brasil-politica
  pipeline_enabled: true
  taxonomy_file: portals/estrato-politica-taxonomy.php

taxonomy:
  schema_version: 2
  file: portals/estrato-politica-taxonomy.php
  layers:
    - categories
    - subcategories

categories:
  - poder
  - brasil
  - eleicoes

branding:
  primary_color: "#1A365D"
  accent_color: "#E53E3E"
  secondary_color: "#2A4365"
  logo_file: estrato-logo.png
  breaking_category: poder
  breaking_label: "Poder"

admin:
  email: tpb@tbj.com.br

hosting:
  target: victor
  vps_ip: 187.127.12.186
  web_root: /var/www/politica.estrato.cc
