# Portal Viagem — frente ex-Sustain
id: estrato-viagem
domain: viagem.estrato.cc
title: Estrato Viagem
tagline: Destinos, rotas e nomadismo
language: pt_BR
timezone: America/Sao_Paulo

theme:
  family: pressgrid
  slug: pressgrid
  source: https://github.com/stantchev/PressGrid-WordPress-Theme/releases/download/v2.5.0/pressgrid-v2.5.0.zip

plugins:
  required:
    - wordpress-seo
    - contact-form-7
  bundled:
    - estrato-portal-bootstrap
    - estrato-rss-bootstrap
    - estrato-publisher-bridge

content:
  mode: pipeline_primary
  rss_preset: brasil-viagem
  pipeline_enabled: true
  taxonomy_file: portals/estrato-viagem-taxonomy.php

taxonomy:
  schema_version: 2
  file: portals/estrato-viagem-taxonomy.php
  layers:
    - categories
    - subcategories

categories:
  - destinos
  - rotas-dicas
  - nomadismo

branding:
  primary_color: "#023E8A"
  accent_color: "#48CAE4"
  secondary_color: "#0077B6"
  logo_file: estrato-logo.png
  breaking_category: destinos
  breaking_label: "Destinos"

admin:
  email: tpb@tbj.com.br

hosting:
  target: victor
  vps_ip: 187.127.12.186
  web_root: /var/www/viagem.estrato.cc

legacy:
  replaces: estrato-sustain
