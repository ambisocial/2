# Pacote E — reverse proxy n8n (automação syndication)
# Instalado em /etc/nginx/conf.d/domains/n8n.estrato.cc.conf

server {
    listen 187.127.12.186:80;
    server_name n8n.estrato.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 187.127.12.186:443 ssl http2;
    server_name n8n.estrato.cc;

    ssl_certificate     /etc/letsencrypt/live/n8n.estrato.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.estrato.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/domains/n8n.estrato.cc.log combined;
    error_log  /var/log/nginx/domains/n8n.estrato.cc.error.log error;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
